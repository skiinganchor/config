---
name: Update flake.lock
"on":
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Access private repository
        uses: webfactory/ssh-agent@master
        with:
          ssh-private-key: ${{ secrets.GH_PRIVATE_KEY }}
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - id: update
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          commit-msg: "chore(flake.lock): update"
          pr-title: "chore(flake.lock): update"
          pr-labels: auto-merge
          token: "${{ secrets.GH_TOKEN_FOR_UPDATES }}"
      - name: Check the proposed Hermes build
        if: ${{ steps.update.outputs.pull-request-number != '' }}
        env:
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: |
          git fetch origin "refs/pull/$PR_NUMBER/head"
          git checkout --detach FETCH_HEAD
          nix build --no-link .#checks.x86_64-linux.hermes-agent
      - name: Merge
        run: gh pr merge --admin "$PR_NUMBER" --rebase --match-head-commit "$(git rev-parse HEAD)"
        env:
          GITHUB_TOKEN: ${{secrets.GH_TOKEN_FOR_UPDATES}}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        if: ${{ steps.update.outputs.pull-request-number != '' }}
