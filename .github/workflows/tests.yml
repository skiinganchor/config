---
name: Tests

"on":
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: cachix/install-nix-action@v32
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Output devenv version
        run: devenv version
      - name: Build the devenv shell and run any git hooks
        run: |
          for i in 1 2 3; do
            devenv test && exit 0
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          exit 1

  tests:
    name: Flake Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake
        run: |
          nix flake check "path:$GITHUB_WORKSPACE/flakes" \
            --no-write-lock-file \
            --show-trace \
            --option allow-import-from-derivation true \
            --override-input cfg "path:$GITHUB_WORKSPACE" \
            --override-input cfg/my-secrets \
              "path:$GITHUB_WORKSPACE/flakes/fixtures/config-private"
